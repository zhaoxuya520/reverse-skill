plugins {
    id 'java'
}

group = 'com.burpmcp'
version = '1.0.0'
sourceCompatibility = '21'
targetCompatibility = '21'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    testImplementation 'net.portswigger.burp.extensions:montoya-api:2025.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Implementation-Title': 'BurpMCP Full Control'
        attributes 'Implementation-Version': version
    }
    // Fat jar - include all dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'burp-mcp-full.jar'
}
