plugins {
    id 'java'
}

group = 'com.burpmcp'
version = file('../VERSION').text.trim()
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.5'
    // Tests construct McpHttpServer; MontoyaApi is needed at test compile and runtime.
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2025.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Implementation-Title': 'BurpMCP Full Control'
        attributes 'Implementation-Version': version
    }
    // Fat jar - include all dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'burp-mcp-full.jar'
}
